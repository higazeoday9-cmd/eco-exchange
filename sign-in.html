<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Eco Exchange</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }

        .header {
            background-color: #333;
            color: #fff;
            padding: 1em 2em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            background-color: #32a852;
            color: #fff;
            padding: 0.5em 1em;
            border-radius: 8px;
            font-size: 1.5em;
            margin: 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2em;
            padding: 0;
            margin: 0;
        }

        nav ul li a {
            font-family: 'Playfair Display', serif;
            text-decoration: none;
            color: #fff;
            font-size: 1em;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            background-color: #32a852;
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
            line-height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }

        .section {
            padding: 3em 2em;
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            margin-bottom: 1em;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1em;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5em;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 0.5em;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }

        .submit-btn {
            width: 100%;
            padding: 0.75em;
            background-color: #32a852;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #28a745;
        }
        .footer {
            text-align: center;
            padding: 2em;
            background-color: #ffffff;
            border-top: 1px solid #d2d2d7;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Eco Exchange</h1>
        <nav>
    <ul>
        <li><a href="index.html">Home Page</a></li>
        <li><a href="browse-items.html">Browse Items</a></li>
        <li><a href="sign-in.html">Sign-In</a></li>
        <li><a href="wallet.html">Wallet</a></li>
        <li><a href="add-item.html">Add Item</a></li>
        <li><a href="about.html">About</a></li>
    </ul>
</nav>
        <div id="profile-container">
            <!-- Profile icon will be dynamically added here -->
        </div>
    </header>

    <section class="section">
        <h2>Sign In</h2>
        <form id="sign-in-form">
            <div class="form-group">
                <label for="user-email">Your Email</label>
                <input type="email" id="user-email" name="user-email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="user-password">Password</label>
                <input type="password" id="user-password" name="user-password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
        </form>

        <h2>Create an Account</h2>
        <form id="create-account-form">
            <div class="form-group">
                <label for="new-user-name">Your Name</label>
                <input type="text" id="new-user-name" name="new-user-name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="new-user-email">Your Email</label>
                <input type="email" id="new-user-email" name="new-user-email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="new-user-password">Password</label>
                <input type="password" id="new-user-password" name="new-user-password" placeholder="Enter a password" required>
            </div>
            <button type="submit" class="submit-btn">Create Account</button>
        </form>
    </section>
    <footer class="footer">
            <p>&copy; 2025 Eco Exchange. All Rights Reserved to oday higaze. Promoting sustainability and waste reduction.</p>
        </div>
    </footer>
    <script>
        const profileContainer = document.getElementById("profile-container");
    
        // Sign In
        document.getElementById("sign-in-form").addEventListener("submit", function (e) {
            e.preventDefault();
            const userEmail = document.getElementById("user-email").value;
            const userPassword = document.getElementById("user-password").value;
    
            // Fetch users from localStorage
            const users = JSON.parse(localStorage.getItem("ecoUsers")) || [];
            const user = users.find(u => u.email === userEmail && u.password === userPassword);
    
            if (user) {
                // Save logged-in user to localStorage
                localStorage.setItem("currentUser", JSON.stringify(user));
    
                // Refresh the page
                location.reload();
    
                // Optionally display a success message before refreshing
                // alert("Successfully signed in!");
            } else {
                alert("Invalid email or password.");
            }
        });
    
        // Create Account
        document.getElementById("create-account-form").addEventListener("submit", function (e) {
            e.preventDefault();
            const newName = document.getElementById("new-user-name").value;
            const newEmail = document.getElementById("new-user-email").value;
            const newPassword = document.getElementById("new-user-password").value;
    
            // Fetch existing users
            const users = JSON.parse(localStorage.getItem("ecoUsers")) || [];
    
            // Check if email already exists
            if (users.some(u => u.email === newEmail)) {
                alert("Email already exists.");
                return;
            }
    
            // Add new user
            const newUser = { name: newName, email: newEmail, password: newPassword };
            users.push(newUser);
            localStorage.setItem("ecoUsers", JSON.stringify(users));
            alert("Account created successfully!");
        });
    
        // Display Profile Icon
        function displayProfileIcon(userName) {
            const initial = userName.charAt(0).toUpperCase();
            profileContainer.innerHTML = `<div class="profile-icon">${initial}</div>`;
        }
    
        // Show profile icon if user is already signed in
        const currentUser = JSON.parse(localStorage.getItem("currentUser"));
        if (currentUser) {
            displayProfileIcon(currentUser.name);
        }
    </script>
    
</body>
</html>
